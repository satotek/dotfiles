snippets:
  # nix switch (home layer, no sudo)
  - name: nix switch
    keyword: nix-switch
    snippet: nix-switch

  # darwin switch (macOS system layer, sudo)
  - name: darwin switch
    keyword: darwin-switch
    snippet: darwin-switch

  # nix flake
  - name: nix flake update
    keyword: nfu
    snippet: nix flake update --flake ~/dotfiles

  - name: nix flake show
    keyword: nfs
    snippet: nix flake show ~/dotfiles

  # garbage collection
  - name: nix garbage collect
    keyword: ngc
    snippet: nix-collect-garbage -d
