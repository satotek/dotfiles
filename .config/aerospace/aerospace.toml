# AeroSpace — i3-like tiling window manager for macOS
# https://nikitabobko.github.io/AeroSpace/guide
#
# キーバインドは上流のデフォルトどおり alt 系。ワークスペース切替も alt-数字。

config-version = 2

after-startup-command = ['exec-and-forget borders style=round order=above width=1.5 hidpi=on active_color=0xffcba6f7 inactive_color=0x33494d64']

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# 役割で分ける。W=ブラウザ, T=ターミナル, C=コミュニケーション, D=開発,
# A=AI, M=メディア, 3=その他（catch-all）。1 と 2 は一時置き場。
# 空でも消えないよう固定する。
persistent-workspaces = ['W', 'T', 'C', 'D', 'A', 'M', '1', '2', '3']

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 3
gaps.inner.vertical = 3
gaps.outer.left = 3
gaps.outer.bottom = 3
gaps.outer.top = 3
gaps.outer.right = 3

# アプリは役割ごとのワークスペースに固定する。AeroSpace は配置を記憶しないので、
# 起動・検出のたびにここで寄せ直す。ルールを書き換えた後は
# `aerospace run-callback --for-every-window on-window-detected` で既存ウィンドウにも適用できる。
# 最初にマッチしたルールだけが動くため、catch-all は必ず末尾に置く。
on-window-detected = [
    # W: ブラウザ
    { if = 'test %{app-bundle-id} = com.apple.Safari || test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace W' },
    # T: ターミナル。Ghostty はネイティブタブが別ウィンドウとして検出されるので tiling を明示する。
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['layout tiling', 'move-node-to-workspace T'] },
    # C: コミュニケーション
    { if = 'test %{app-bundle-id} = com.hnc.Discord || test %{app-bundle-id} = jp.naver.line.mac || test %{app-bundle-id} = com.apple.mail', run = 'move-node-to-workspace C' },
    # D: 開発
    { if = 'test %{app-bundle-id} = com.google.android.studio || test %{app-bundle-id} = com.t3tools.t3code || test %{app-bundle-id} = dev.zed.Zed || test %{app-bundle-id} = com.microsoft.VSCodeInsiders', run = 'move-node-to-workspace D' },
    # A: AI
    { if = 'test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = com.anthropic.claudefordesktop || test %{app-bundle-id} = com.meta.endo || test %{app-bundle-id} = com.anysphere.sand', run = 'move-node-to-workspace A' },
    # M: メディア
    { if = 'test %{app-bundle-id} = com.apple.Music', run = 'move-node-to-workspace M' },
    # 設定アプリやパスワードマネージャはタイルせずフロート。catch-all より前に置き、3 へ流さない。
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.1password.1password', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = org.pqrs.Karabiner-EventViewer', run = 'layout floating' },
    # Finder はファイル操作の補助なので、タイルに混ぜず開いた場所にフロートさせる。
    { if = 'test %{app-bundle-id} = com.apple.finder', run = 'layout floating' },
    # 3: その他（catch-all）
    { if = 'true', run = 'move-node-to-workspace 3' },
]

[mode.main.binding]
    # レイアウト切替
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # フォーカス
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # ウィンドウ移動
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # リサイズ
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # 最大化（AeroSpace 独自。macOS ネイティブ全画面ではない）
    alt-f = 'fullscreen'

    # ワークスペース（役割名）
    alt-w = 'workspace W'
    alt-t = 'workspace T'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-a = 'workspace A'
    alt-m = 'workspace M'
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'

    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # モニタ間の移動。focus は既定で --boundaries workspace なので alt-hjkl では
    # モニタを跨げない。focus-monitor に別途バインドが要る（上流の既定にも無い）。
    ctrl-alt-h = 'focus-monitor --wrap-around left'
    ctrl-alt-j = 'focus-monitor --wrap-around down'
    ctrl-alt-k = 'focus-monitor --wrap-around up'
    ctrl-alt-l = 'focus-monitor --wrap-around right'

    ctrl-alt-shift-h = 'move-node-to-monitor --wrap-around --focus-follows-window left'
    ctrl-alt-shift-j = 'move-node-to-monitor --wrap-around --focus-follows-window down'
    ctrl-alt-shift-k = 'move-node-to-monitor --wrap-around --focus-follows-window up'
    ctrl-alt-shift-l = 'move-node-to-monitor --wrap-around --focus-follows-window right'

    alt-shift-semicolon = 'mode service'
    ctrl-alt-w = 'mode window'
    ctrl-alt-space = 'mode layout'

[mode.window.binding]
    esc = 'mode main'
    h = 'join-with left'
    j = 'join-with down'
    k = 'join-with up'
    l = 'join-with right'
    m = 'focus-monitor --wrap-around next'
    shift-m = 'move-node-to-monitor --wrap-around --focus-follows-window next'
    ctrl-m = 'move-node-to-monitor --wrap-around --focus-follows-window prev'
    s = 'resize smart -50'
    d = 'resize smart +50'
    ctrl-alt-space = 'mode layout'

[mode.layout.binding]
    esc = 'mode main'
    t = 'layout tiles'
    c = 'layout accordion'
    f = 'layout floating tiling'
    h = 'layout horizontal'
    v = 'layout vertical'
    b = 'balance-sizes'
    r = 'flatten-workspace-tree'
    ctrl-alt-w = 'mode window'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # レイアウトをリセット
    f = ['layout floating tiling', 'mode main'] # フロート / タイル切替
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# GUI 起動の AeroSpace は Homebrew と /usr/bin しか PATH を持たないため、
# exec-* から Nix のバイナリ（borders など）を引けるようにする。
# exec セクションを書くと既定の Homebrew PATH が消えるので、自分で先頭に戻す。
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.nix-profile/bin:${PATH}'
