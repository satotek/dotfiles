# herdr config
# 全オプションは `herdr --default-config` で確認できる。
# 反映: `herdr server reload-config`(アプリ再起動不要)。
# 自前キーを白紙化: `herdr config reset-keys`。

# セットアップ済みなので初回オンボーディング通知を出さない。
onboarding = false

[session]
# 公式integrationが通知したnative session IDを使い、server再起動後も会話を復元する。
resume_agents_on_restore = true

[theme]
# 他ツールと揃えて catppuccin(herdr のデフォルトも catppuccin)。
# 選択肢: catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
#         one-dark, solarized, kanagawa, rose-pine, vesper
name = "catppuccin"

[keys]
# prefix(leader)は ctrl+q(herdr のデフォルトは ctrl+b)。
# ctrl+a は nvim のインクリメント・zsh の行頭移動と干渉するため不採用。
# ctrl+q は nvim では矩形選択の予備キー(ctrl+v で足りる)、zsh では push-line のみで実質空き。
# フロー制御(XON)は zsh の NO_FLOW_CONTROL 設定済みなので問題なし。
# デフォルトで focus_pane_left/down/up/right = prefix+h/j/k/l(hjkl ペイン移動)、
# zoom=prefix+z など tmux 風なので、prefix を変えるだけで手癖がほぼそのまま使える。
# prefix 2回押しで生の ctrl+q を配下アプリへ素通しできる(tmux の send-prefix 相当・検証済み)。
prefix = "ctrl+q"

# エージェント間を prefix+shift+p/n で前後移動する。
# 競合する既定の rename_pane(prefix+shift+p) と
# new_workspace(prefix+shift+n) は無効化する。
previous_agent = "prefix+shift+p"
next_agent = "prefix+shift+n"
rename_pane = ""
new_workspace = ""

# tmux の bind \ / bind - に寄せて、\ と - の両方を分割に割当。
# ※ herdr の vertical/horizontal の向きは実機で確認し、逆なら入れ替える。
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"

# lazygit を一時ペインで開く(tmux の popup 相当)。終了で自動的に閉じる。
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

# alt 併用キーはターミナル依存で不安定なため、alt 無しの代替バインドも用意。
# (prefix+g は goto、prefix+shift+g は new_worktree で使用済みなので t を使う)
[[keys.command]]
key = "prefix+t"
type = "pane"
command = "lazygit"

[ui]
# エージェントサイドバーを「要対応キュー」順に並べる("spaces"=スペース順が既定)。
# 複数エージェントを回す時に、対応が必要なものが上に来る。
agent_panel_sort = "priority"

[ui.toast]
# エージェントが完了/入力待ちになったら通知。
# "terminal"=外側端末(WezTerm)に通知を依頼、"system"=OSへ直接、
# "herdr"=アプリ内トースト、"off"=無効。飛ばなければ "system" に変える。
delivery = "terminal"

[experimental]
# prefix モード中だけ macOS の入力ソースを ASCII に切り替える。
# 日本語IME が ON のままでも ctrl+a 起点のコマンドが確実に登録される(macOS のみ・ベストエフォート)。
switch_ascii_input_source_in_prefix = true

# エージェントペインで日本語IMEの変換候補ウィンドウがカーソルに追従するようにする。
# allow-list で claude/codex のみに限定 → nvim 等では無効化し、余分カーソルの副作用を避ける。
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
