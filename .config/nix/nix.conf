experimental-features = nix-command flakes

# Note: extra binary caches (e.g. cache.numtide.com used by llm-agents.nix for
# the codex Rust build) are configured at the daemon level instead of here,
# because non-trusted users have their substituter/key settings silently
# ignored. See:
#   - macOS:  nix-darwin -> environment.etc."nix/nix.custom.conf"
#   - Linux:  nix/scripts/bootstrap-system-nix.sh (run once with sudo)
