name: Lint

# pre-commit を経ないコミット（Web 編集、--no-verify、フック未導入の環境）もここで捕まえる。
# ビルドはせず、整形とワークフローの検査だけなので 1 分程度で終わる。

# 更新ボットの PR は flake.lock だけを変え、数秒で自動マージされてブランチが消えるため、
# 起動が間に合わず失敗扱いになる。検査対象もないので起動しない。
on:
  push:
    branches: [main]
    paths-ignore: [flake.lock]
  pull_request:
    paths-ignore: [flake.lock]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check formatting
        run: nix build --no-link '.#checks.x86_64-linux.nix-format'

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run --inputs-from . nixpkgs#zizmor -- --no-progress .github
