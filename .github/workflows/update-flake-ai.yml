name: 'Bot: Update AI agent inputs'

# AI エージェント/スキル系の flake input を毎日更新。
# 更新が速い（claude-code は毎日のようにリリース）ので高頻度で追従する。
# numtide バイナリキャッシュを設定してビルド済みを DL（ソースコンパイルを避ける）、
# Linux home 構成のビルドで検証してから PR を作り、自動マージする。

on:
  schedule:
    - cron: '0 21 * * *' # 毎日 21:00 UTC（= 翌 06:00 JST）
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # numtide キャッシュを設定 = llm-agents/codex/claude-code をビルド済みで DL。
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Update AI agent flake inputs
        run: |
          nix flake update \
            llm-agents \
            agent-browser \
            agent-skills \
            anthropic-skills \
            herdr-skill \
            mattpocock-skills \
            vercel-agent-skills \
            vercel-next-skills \
            vercel-skills

      # 自動マージの安全弁: 更新後の inputs で Linux home 構成が実際にビルドできるか検証。
      # 失敗すればここで止まり PR を作らない（壊れた更新が main に入らない）。
      - name: Validate (build linux home config)
        run: nix build --no-link '.#homeConfigurations."nosuke@linux-x86_64".activationPackage'

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(nix): update AI agent inputs'
          title: 'chore(nix): update AI agent inputs'
          body: |
            AI エージェント / スキル系 flake input の更新（毎日・ビルド検証済み）。
            llm-agents (claude-code / codex 等) / agent-browser / *-skills。

            _このPRは update-flake-ai ワークフローが自動生成し、自動マージされます。_
          branch: chore/update-flake-ai
          delete-branch: true
          labels: dependencies,automated

      # 検証を通っているので自動マージ。必須チェックが無い場合は即マージにフォールバック。
      - name: Auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          gh pr merge --auto --squash --delete-branch "$pr" \
            || gh pr merge --squash --delete-branch "$pr"
