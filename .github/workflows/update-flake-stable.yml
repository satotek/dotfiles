name: 'Bot: Update stable inputs'

# 基盤系の flake input を3日おきに更新。AI系は update-flake-ai.yml が毎日担当。
# Linux home 構成のビルドで検証してから PR を作り、自動マージする。

on:
  schedule:
    # AI 側と同時に flake.lock を書き換えないよう 30 分ずらす。
    - cron: '47 23 */3 * *' # 3日おき 23:47 UTC（= 翌 08:47 JST）。月境界で間隔は多少変動。
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # numtide キャッシュを設定 = AI/各種ツールをビルド済みで DL（ソースコンパイル回避）。
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Update stable inputs
        run: nix flake update nixpkgs nix-darwin home-manager nix-index-database

      # 自動マージの安全弁: 更新後の inputs で Linux home 構成が実際にビルドできるか検証。
      - name: Validate (build linux home config)
        run: nix build --no-link '.#homeConfigurations."nosuke@linux-x86_64".activationPackage'

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore(nix): update stable inputs'
          title: 'chore(nix): update stable inputs (nixpkgs/darwin/home-manager/nix-index)'
          body: |
            基盤系 flake input の更新（3日おき・ビルド検証済み）:
            nixpkgs / nix-darwin / home-manager / nix-index-database。

            _このPRは update-flake-stable ワークフローが自動生成し、自動マージされます。_
          branch: chore/update-flake-stable
          delete-branch: true
          labels: dependencies,automated

      - name: Auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          pr="$PR_NUMBER"
          gh pr merge --auto --squash --delete-branch "$pr" \
            || gh pr merge --squash --delete-branch "$pr"
