name: 'Bot: Update stable inputs'

# 基盤系の flake input を3日おきに更新して PR を作る。
# nixpkgs 等は当日リリースが壊れていることがあるので、頻度を落として安定重視。
# （AI 系は update-flake-ai.yml が毎日担当。ここでは触らない）
# マージは人が確認して行う。

on:
  schedule:
    - cron: '0 21 */3 * *' # 3日おき 21:00 UTC（= 翌 06:00 JST）。月境界で間隔は多少変動。
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update stable flake inputs
        run: nix flake update nixpkgs nix-darwin home-manager

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(nix): update stable inputs'
          title: 'chore(nix): update stable inputs (nixpkgs/darwin/home-manager)'
          body: |
            基盤系 flake input の更新（3日おき）: nixpkgs / nix-darwin / home-manager。

            マージ後、各マシンで `git pull` して切替を実行してください。

            _このPRは update-flake-stable ワークフローが自動生成しました。_
          branch: chore/update-flake-stable
          delete-branch: true
          labels: dependencies,automated
