name: 'Bot: Update stable inputs'

# 基盤系の flake input を3日おきに更新（3日以上経った版のみ = age gate）。
# nixpkgs 等の当日リリース事故を避ける。AI系は update-flake-ai.yml が毎日担当。
# Linux home 構成のビルドで検証してから PR を作り、自動マージする。

on:
  schedule:
    - cron: '0 21 */3 * *' # 3日おき 21:00 UTC（= 翌 06:00 JST）。月境界で間隔は多少変動。
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  MIN_AGE_DAYS: '3' # これより新しい版は取り込まない（当日事故回避）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # numtide キャッシュを設定 = AI/各種ツールをビルド済みで DL（ソースコンパイル回避）。
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # input を1つずつ更新し、locked.lastModified が MIN_AGE_DAYS 未満なら差し戻す。
      # git checkout -- flake.lock はインデックス(=採用済みの良い更新)へ戻すので、
      # 若すぎる input だけを個別に巻き戻せる。
      - name: Update stable inputs (only versions older than MIN_AGE_DAYS)
        run: |
          set -euo pipefail
          cutoff=$(( $(date +%s) - MIN_AGE_DAYS * 86400 ))
          for inp in nixpkgs nix-darwin home-manager; do
            echo "::group::update $inp"
            nix flake update "$inp"
            # root.inputs からノード名を解決（nixpkgs は nixpkgs_2 等に別名化されるため）。
            node=$(jq -r ".nodes.root.inputs.\"$inp\" | if type==\"array\" then .[-1] else . end" flake.lock)
            lm=$(jq -r ".nodes.\"$node\".locked.lastModified // 0" flake.lock)
            if [ "$lm" -gt "$cutoff" ]; then
              age=$(( ( $(date +%s) - lm ) / 86400 ))
              echo "$inp: locked版が ${age}日前 (< ${MIN_AGE_DAYS}日) のため差し戻し"
              git checkout -- flake.lock
            else
              echo "$inp: OK (>= ${MIN_AGE_DAYS}日) 採用"
              git add flake.lock
            fi
            echo "::endgroup::"
          done

      # 自動マージの安全弁: 更新後の inputs で Linux home 構成が実際にビルドできるか検証。
      - name: Validate (build linux home config)
        run: nix build --no-link '.#homeConfigurations."nosuke@linux-x86_64".activationPackage'

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(nix): update stable inputs'
          title: 'chore(nix): update stable inputs (nixpkgs/darwin/home-manager)'
          body: |
            基盤系 flake input の更新（3日おき・3日以上経った版のみ・ビルド検証済み）:
            nixpkgs / nix-darwin / home-manager。

            _このPRは update-flake-stable ワークフローが自動生成し、自動マージされます。_
          branch: chore/update-flake-stable
          delete-branch: true
          labels: dependencies,automated

      - name: Auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          gh pr merge --auto --squash --delete-branch "$pr" \
            || gh pr merge --squash --delete-branch "$pr"
