# Linux/macOS の nix/home-manager/programs/lazygit/default.nix に対応する
# Windows 用の設定。コミット種別の項目は Nix 側と揃えること。
#
# git.diffRenderers は lazygit 0.64 以降のキー名。それ以前は無視されて delta が
# 効かないので、`winget upgrade JesseDuffield.lazygit` で更新する。
# dark / side-by-side などは delta が ~/.config/git/config の [delta] から読む。
#
# lazygit は起動時の設定 migration で YAML のアンカー・エイリアス (&x / *x) を
# 扱えず "Alias nodes are not supported" を出すので、重複していても展開して書く。
git:
  overrideGpg: true
  parseEmoji: true
  log:
    showWholeGraph: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
gui:
  colorScheme: dark
  commitHashLength: 7
  expandFocusedSidePanel: true
  language: ja
  nerdFontsVersion: '3'
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true
  showRandomTip: false
os:
  editPreset: nvim
customCommands:
  - key: <c-c>
    context: files
    description: commit files with format
    loadingText: Committing...
    prompts:
      - type: menu
        key: Type
        title: What kind of commit type is it?
        options:
          - { name: fix, value: fix, description: バグや不具合の修正 }
          - { name: feat, value: feat, description: 新機能の追加 }
          - { name: docs, value: docs, description: ドキュメントの更新や改善 }
          - { name: style, value: style, description: コードフォーマットの修正、UIのみの変更 }
          - { name: refactor, value: refactor, description: パフォーマンスの改善なしのコードの改善 }
          - { name: test, value: test, description: テストの追加や改善 }
          - { name: perf, value: perf, description: パフォーマンスの改善 }
          - { name: chore, value: chore, description: ビルドプロセスの変更や改善 }
          - { name: ci, value: ci, description: CI設定の変更 }
          - { name: build, value: build, description: ビルドシステムや依存関係の変更 }
          - { name: revert, value: revert, description: 以前の変更の取り消し }
          - { name: wip, value: wip, description: 作業中 }
      - type: input
        key: Scope
        title: Scope (optional)
        initialValue: ''
      - type: input
        key: Message
        title: Enter the Message
        initialValue: ''
      - type: confirm
        title: Commit
        body: "Commit with the message '{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: {{.Form.Message}}'. Is this okay?"
    command: '{{$scope := ""}}{{if .Form.Scope}}{{$scope = printf "(%s)" .Form.Scope}}{{end}}git commit -m {{printf "%s%s: %s" .Form.Type $scope .Form.Message | quote}}'
  - key: <c-e>
    context: files
    description: commit with body (エディターで本文まで書く)
    output: terminal
    prompts:
      - type: menu
        key: Type
        title: What kind of commit type is it?
        options:
          - { name: fix, value: fix, description: バグや不具合の修正 }
          - { name: feat, value: feat, description: 新機能の追加 }
          - { name: docs, value: docs, description: ドキュメントの更新や改善 }
          - { name: style, value: style, description: コードフォーマットの修正、UIのみの変更 }
          - { name: refactor, value: refactor, description: パフォーマンスの改善なしのコードの改善 }
          - { name: test, value: test, description: テストの追加や改善 }
          - { name: perf, value: perf, description: パフォーマンスの改善 }
          - { name: chore, value: chore, description: ビルドプロセスの変更や改善 }
          - { name: ci, value: ci, description: CI設定の変更 }
          - { name: build, value: build, description: ビルドシステムや依存関係の変更 }
          - { name: revert, value: revert, description: 以前の変更の取り消し }
          - { name: wip, value: wip, description: 作業中 }
      - type: input
        key: Scope
        title: Scope (optional)
        initialValue: ''
    command: '{{$scope := ""}}{{if .Form.Scope}}{{$scope = printf "(%s)" .Form.Scope}}{{end}}git commit -e -m {{printf "%s%s: " .Form.Type $scope | quote}}'
