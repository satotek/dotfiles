add_newline = false
command_timeout = 200
scan_timeout = 10

format = """$os$directory$nodejs$python$azure$git_branch$git_status$fill$memory_usage$battery$time$line_break$character"""
right_format = "$cmd_duration"

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold white"

[os.symbols]
Macos = ""

[directory]
truncate_to_repo = false
truncation_length = 6
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
format = "[  $path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only_style = "bold cyan"

[nodejs]
format = "[$symbol]($style) "
symbol = ""
style = "bold green"

[python]
format = '[${symbol} \($virtualenv\)]($style) '
symbol = ""
style = "bold yellow"
python_binary = "python3"

[azure]
disabled = false
format = "[$symbol$subscription]($style) "
symbol = "󰠅  "
style = "bold blue"

[git_branch]
symbol = "   "
format = "on [$symbol$branch]($style) "
style = "bold green"

[git_status]
format = "[$staged$modified$untracked$deleted$renamed$conflicted$ahead_behind]($style)"
style = "bold yellow"
staged = "+${count} "
modified = "!${count} "
untracked = "?${count} "
deleted = "x${count} "
renamed = "»${count} "
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
stashed = ""

[cmd_duration]
min_time = 500
format = "took [  $duration]($style) "
style = "bold yellow"

[memory_usage]
disabled = false
threshold = -1
format = "[$symbol$ram_pct]($style) "
symbol = "󰍛 "
style = "bold white"

[battery]
disabled = false
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 100
style = "bold white"

[time]
disabled = false
time_format = "%T"
format = "[  $time]($style)"
style = "bold blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[V](bold green)"
